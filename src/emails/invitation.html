<!doctype html>
<!--
  Organization invitation email.
  Placeholders ({{name}}) are filled by src/lib/emails.ts → renderInvitationEmail():
    {{org}}      organization name (escaped)
    {{inviter}}  who sent the invite (escaped)
    {{url}}      magic-link accept URL
    {{email}}    invited email address (escaped)
    {{days}}     how many days until the link expires
  This file is a plain HTML template — edit it freely to restyle the email.
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmos Pay - Invitation</title>
</head>

<body style="margin:0;background:#FFFFFF;font-family:'Open Sauce One',Arial,sans-serif;color:#000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0"
          style="background:#FFFFFF;border-radius:24px;overflow:hidden;border:1px solid #E0E0E0;">
          <tr>
            <td style="padding:30px 34px 28px;">
              <div style="margin-bottom:6px;"><a href="https://dev.cosmospay.lat" style="display:inline-block;text-decoration:none;"><img src="https://dev.cosmospay.lat/brand/lockup-cosmos-pay.png" alt="Cosmos Pay" height="32" style="height:32px;width:auto;display:block;border:0;outline:none;text-decoration:none;" /></a></div>
              <h1 style="font-size:22px;margin:14px 0 6px;color:#000000;">You're invited to join {{org}}</h1>
              <p style="font-size:15px;line-height:1.6;color:#575757;margin:0 0 22px;">{{inviter}} invited you to
                collaborate on <b>{{org}}</b> in the Cosmos&nbsp;Pay developer dashboard.</p>
              <a href="{{url}}"
                style="display:inline-block;background:#000877;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:13px 24px;border-radius:16px;">Accept
                invitation</a>
              <p style="font-size:13px;line-height:1.6;color:#707070;margin:22px 0 0;">This link expires in {{days}}
                days. Sign in with <b>{{email}}</b> to accept. If you weren't expecting this, you can ignore this email.
              </p>
              <p style="font-size:12px;color:#707070;margin:18px 0 0;word-break:break-all;">{{url}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
